# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build each project in parallel where possible.
org.gradle.parallel=true

# AndroidX is required by Compose and modern androidx artifacts.
android.useAndroidX=true

# Kotlin code style for the Kotlin Gradle plugin.
kotlin.code.style=official

# Only generate the resource classes an app module actually uses.
android.nonTransitiveRClass=true
